name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/templates/**"
      - "site/static/**"
      - "engine/pipeline/build.py"
      - "data/**"
      - "topics/**/profile.yaml"
  workflow_dispatch: {}
  workflow_call: {}
  # NOTE: a push made with the default GITHUB_TOKEN (as harvest.yml and
  # publish.yml's own commits are) deliberately does NOT trigger other
  # workflows' `on: push` — GitHub's anti-recursion protection. So the
  # `push` trigger above only ever fires for a human-authored push (e.g.
  # a template change pushed via GitHub Desktop). publish.yml calls this
  # workflow directly via `workflow_call` instead of relying on push.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m engine build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
