    status: broken
    verified: 2026-10-02
    note: "HTTP 404."
  - id: bis-press
    url: https://www.bis.org/press_and_speeches.rss
    status: broken
    verified: 2026-10-02
    note: "HTTP 404 — use bis-speeches instead."
  - id: imf-news
    url: "https://www.imf.org/en/News/RSS?Language=ENG"
